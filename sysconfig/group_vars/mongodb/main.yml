---
# mongodb8_cis lab: site values, used by every run. Which rules run is chosen per run with a profile:
#   ansible-playbook playbooks/site.yml -e @profiles/<profile>.yml
# Profiles: profiles/c1-level1-defaults.yml, c2-level2-defaults.yml, c3-full-benchmark.yml. Write true/false unquoted.

# --- Install ------------------------------------------------------------------
mongodb8_cis_install: true                     # fresh VM: add the Enterprise repo and install MongoDB 8.0

# --- Site values (read only when their rule is on) ----------------------------
mongodb8_cis_admin_user: frqadminDB            # 2.1: admin created with role root; login for 2.x/3.x reads
mongodb8_cis_admin_password: "changeme"   # lab only: plaintext (move to Vault for real use)
mongodb8_cis_tls_certificate_key_file: /etc/pki/mongodb/server.pem      # 4.3: copied by playbooks/prep-tls.yml
mongodb8_cis_tls_ca_file: /etc/pki/mongodb/ca.pem                       # 4.3: copied by playbooks/prep-tls.yml
mongodb8_cis_port: 27100                       # 6.1: new port (labelled mongod_port_t by the role)
