---
# mongodb8_cis lab settings. The role applies the full benchmark by default (risky rules on);
# this file only gives the site values. One run on a fresh VM, then once more for changed=0:
#   ansible-playbook playbooks/site.yml --limit <host>
# To make an exception, set the rule's switch to false here. Write true/false unquoted.

# --- Install ------------------------------------------------------------------
mongodb8_cis_install: true                     # fresh VM: add the Enterprise repo and install MongoDB 8.0

# --- Levels: Level 2 = Level 1 + Level 2 (all 23 rules) ---------------------
mongodb8_cis_level_1: true
mongodb8_cis_level_2: true

# --- 2.1 Admin account ----------------------------------------------------------
mongodb8_cis_admin_user: frqadminDB            # created with role root; the role logs in with it for 2.x/3.x reads
mongodb8_cis_admin_password: "changeme"        # lab only: plaintext (move to Vault for real use)

# --- 4.3 TLS: certificates on THIS control node (src) -> on the server ---------
# Lab certificates carry serverAuth + clientAuth, so the role logs in with the server certificate
# (mongodb8_cis_shell_tls_certificate_key_src stays empty).
mongodb8_cis_tls_certificate_key_src: "{{ inventory_dir }}/../pki/{{ inventory_hostname }}.pem"   # certificate + private key in one PEM
mongodb8_cis_tls_ca_src: "{{ inventory_dir }}/../pki/ca.pem"                                     # CA that signed server and client certificates
mongodb8_cis_tls_certificate_key_file: /etc/pki/mongodb/server.pem
mongodb8_cis_tls_ca_file: /etc/pki/mongodb/ca.pem

# --- 6.1 Non-default port -------------------------------------------------------
mongodb8_cis_port: 27100                       # the role labels it mongod_port_t for SELinux

# --- Site decisions for Manual rules (role defaults kept; listed for review) ----
mongodb8_cis_revoke_admin_roles: []            # 3.1: e.g. ["admin.badadmin"] after reading the report
mongodb8_cis_drop_custom_roles: []             # 3.4: e.g. ["shop.orderReader"] after reading the report
mongodb8_cis_revoke_superuser_roles: []        # 3.5: e.g. ["admin.ops"]; never the admin above
mongodb8_cis_audit_filter: ""                  # 5.2: empty = audit everything
mongodb8_cis_javascript_needed: false          # 6.3: lab apps don't use server-side JS

# --- Exceptions (rules switched off for this site) ------------------------------
# None: the lab runs the full benchmark. Example:
# mongodb8_cis_rule_4_4: false                 # FIPS off
