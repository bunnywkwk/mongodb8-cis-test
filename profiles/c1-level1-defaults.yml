# C1: CIS Level 1 with the role's defaults ("safe out of the box"). Risky rules stay off.
# Expected on a fresh install (✅ compliant, ❌ not compliant, 👤 a person reviews):
#   1.1 👤 version report        2.1 ❌ skipped (off)        2.2 ❌ skipped (off)
#   3.1 ✅ PASS (no users)        3.2 👤 auth disabled        3.3 ✅ PASS (runs as mongod)   3.4 👤 0 custom roles
#   4.2 ❌ FAIL (TLS off)         4.3 ❌ skipped (off)        5.1 ✅ auditLog added (changed)
#   6.1 ❌ skipped (off)          7.1 ✅ NOT APPLICABLE        7.2 ❌ FAIL (0755)
# Rerun: changed=0.
mongodb8_cis_level_1: true
mongodb8_cis_level_2: false
